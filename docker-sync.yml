version: "2"
syncs:
  niogg-app-sync: ## the unique name of the volume for this project. Recommended pattern <APPNAME>-sync
    src: "."
    sync_excludes: [".git", ".vscode", "node_modules", "public/storage/*", "mix-manifest.json", "public/build/*", ".DS_Store", "storage/framework/**/*", "./vendor/**/*"]
    sync_userid: "501" ## The user id gotten from the host by running id -u command in the terminal
    sync_group: "sail" ## The groupname created by the related Dockerfile for the container
    sync_groupid: "20" ## The group id from the fotten from running id -g command in the terminal
    sync_strategy: "native_osx" ## The sync strategy to use. Options: 'native_osx', 'unison', 'unison2', 'lsyncd', 'rsync'
    notify_terminal: true
